name: Gamerboxd-prod

services:
    
  backend:
    build: 
      context: ./backend
      target: production

    mem_limit: 512M
    restart: unless-stopped
      
    environment:
      DB_HOST: db

    env_file:
      - .env

    ports:
      - "127.0.0.1:8000:8000"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.7-alpine3.24
    mem_limit: 512M
    restart: unless-stopped

    volumes:
      - pgdata:/var/lib/postgresql

    environment:
      POSTGRES_USER: ${VM_USER}
      POSTGRES_PASSWORD: ${VM_PASS}

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


volumes:
  pgdata: